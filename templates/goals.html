<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals | Fit-Track</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            background: linear-gradient(120deg, #f8fafc 0%, #e5eafb 100%);
        }
        .uni-card {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(7px);
            border-radius: 1.25rem;
            box-shadow: 0 4px 16px 0 rgba(80,110,140,0.10);
            border: 1.5px solid #e0e7ef;
            transition: box-shadow 0.16s, transform 0.14s;
        }
        .uni-card:hover {
            box-shadow: 0 10px 32px 0 rgba(48,72,124,0.14);
            transform: translateY(-3px) scale(1.017);
        }
        .main-link {
            color: #fafafaff;
            font-weight: 600;
            position:relative;
            transition: color .21s;
        }
        .main-link:hover, .main-link:focus { color: #ffffffff; }
    </style>
</head>

<body>
    <div class="bg-white bg-opacity-80 shadow-sm py-8">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-center mb-6">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Fit-Track Logo" width="70" height="70" class="mr-4 rounded-full border border-blue-200 shadow">
                <div class="text-3xl font-black text-blue-800 tracking-wide">Fit-Track</div>
            </div>
        </div>
    </div>
    <nav class="bg-blue-900 p-4 shadow-md">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center">
                <div>
                    <a href="/dashboard" class="text-white text-lg font-bold mr-4 main-link">Dashboard</a>
                    <a href="/social" class="text-white text-lg font-bold mr-4 main-link">Social</a>
                    <a href="/visualize_progress" class="text-white text-lg font-bold main-link">Visualize Progress</a>
                </div>
                <div>
                    {% if 'user' in session %}
                    <a href="/logout" class="text-white main-link">Logout</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto py-10">
        <h1 class="text-2xl font-bold mb-5 text-center text-blue-900 tracking-tight">Set Your Goal</h1>
        <form action="/goals" method="POST" class="max-w-lg mx-auto uni-card p-10 rounded-lg">
            <!-- Goal fields -->
            <div class="mb-5">
                <label for="goal_type" class="block text-sm font-semibold text-gray-700 mb-1">Goal Type:</label>
                <select name="goal_type" id="goal_type" class="block w-full rounded border border-gray-300 px-3 py-2 focus:outline-none focus:border-blue-600">
                    <option value="weight_loss">Weight Loss</option>
                    <option value="muscle_gain">Muscle Gain</option>
                    <option value="flexibility">Flexibility</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="mb-5">
                <label for="target" class="block text-sm font-semibold text-gray-700 mb-1">Target:</label>
                <input type="text" name="target" id="target" required class="block w-full rounded border border-gray-300 px-3 py-2 focus:outline-none focus:border-blue-600">
            </div>
            <div class="mb-5">
                <label for="deadline" class="block text-sm font-semibold text-gray-700 mb-1">Deadline:</label>
                <input type="date" name="deadline" id="deadline" required class="block w-full rounded border border-gray-300 px-3 py-2 focus:outline-none focus:border-blue-600">
            </div>
            <!-- Reminder fields -->
            <div class="mb-5 pt-2 border-t border-slate-200">
                <div class="font-semibold text-blue-800 mb-1 flex items-center"><i class="fa-solid fa-bell mr-2 text-blue-400"></i> Goal Reminder (optional):</div>
                <label for="reminder_type" class="text-sm text-gray-700 mb-1 block">Method:</label>
                <select id="reminder_type" name="reminder_type" class="block w-full rounded border border-gray-300 px-3 py-2 mb-3 focus:outline-none focus:border-blue-400">
                    <option value="">No Reminder</option>
                    <option value="call">Phone Call</option>
                    <option value="sms">SMS/Text Message</option>
                </select>
                <label for="reminder_datetime" class="text-sm text-gray-700 mb-1 block">When:</label>
                <input type="datetime-local" id="reminder_datetime" name="reminder_datetime" class="block w-full rounded border border-gray-300 px-3 py-2 mb-3 focus:outline-none focus:border-blue-400">
                <label for="reminder_message" class="text-sm text-gray-700 mb-1 block">Reminder Message:</label>
                <input type="text" id="reminder_message" name="reminder_message" maxlength="70" placeholder="e.g. Remember your goal to walk 5km!" class="block w-full rounded border border-gray-300 px-3 py-2 focus:outline-none focus:border-blue-400">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white text-lg font-bold px-4 py-2 rounded hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-2">Set Goal</button>

            
        </form>
    </div>

    <footer class="bg-slate-200 text-center py-4 fixed bottom-0 w-full shadow-sm border-t">
        <p class="text-gray-700 text-sm">&copy; 2025 Fit-Track. All rights reserved.</p>
    </footer>
</body>
</html>
